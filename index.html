<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthGuard - 악플 위험도 검출기</title>
  
  <!-- Google Fonts: Outfit (영어/숫자) & Noto Sans KR (한국어) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       1. DESIGN SYSTEM & CSS VARIABLES
       ------------------------------------------------------------- */
    :root {
      /* 기본 다크 테마 색상 정의 */
      --bg-dark: #090d16;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      /* 게이지 상태에 따른 색상 정의 */
      --color-safe: #10b981;      /* 초록색 (안전) */
      --color-caution: #f59e0b;   /* 노란색 (주의) */
      --color-danger: #ef4444;    /* 빨간색 (위험) */
      
      /* 상태별 글로우 효과 색상 정의 */
      --glow-safe: rgba(16, 185, 129, 0.4);
      --glow-caution: rgba(245, 158, 11, 0.4);
      --glow-danger: rgba(239, 68, 68, 0.5);

      /* 동적 업데이트를 위한 변수 설정 (기본값: 안전) */
      --gauge-color: var(--color-safe);
      --gauge-glow: var(--glow-safe);
    }

    /* 전체 리셋 및 기본 서체 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
      color: var(--text-main);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* -------------------------------------------------------------
       2. CARD LAYOUT (SaaS STYLE)
       ------------------------------------------------------------- */
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-2px);
    }

    /* 헤더 영역 */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #ffffff 60%, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 입력 영역 */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      color: white;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.2);
    }

    /* 분석 버튼 */
    .btn-analyze {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
    }

    .btn-analyze:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(99, 102, 241, 0.45);
    }

    .btn-analyze:active {
      transform: translateY(0);
    }

    /* -------------------------------------------------------------
       3. GAUGE BAR & RESULTS
       ------------------------------------------------------------- */
    .result-section {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 1.5rem;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
    }

    /* 위험도 퍼센트 숫자 */
    .percent-counter {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
    }

    /* 게이지 바 트랙 */
    .gauge-track {
      width: 100%;
      height: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    /* 가로 게이지 바 (CSS 트랜지션 애니메이션 적용) */
    .gauge-fill {
      height: 100%;
      width: 0%; /* 기본값 0% */
      background: var(--gauge-color);
      border-radius: 10px;
      box-shadow: 0 0 12px var(--gauge-glow);
      /* 가로 너비(width) 변경 시 최소 1초 동안 부드럽게 증가하도록 설정 */
      transition: width 1s ease, background-color 0.5s ease, box-shadow 0.5s ease;
    }

    /* 결과 요약 메시지 */
    .result-message {
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      padding: 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      color: var(--gauge-color);
      transition: color 0.5s ease;
    }

    /* 탐지된 악플 단어 목록 */
    .word-list-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 1rem;
    }

    .word-list-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .word-ul {
      list-style-type: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .word-li {
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      color: var(--text-main);
    }

    .empty-state {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- 카드 본체 구조 -->
  <div class="container">
    <header>
      <h1>악플 위험도 검출기</h1>
      <div class="subtitle">텍스트를 분석하여 안전 상태를 모니터링합니다.</div>
    </header>

    <!-- 입력 텍스트 에어리어 및 분석 시작 버튼 -->
    <div class="input-section">
      <textarea id="commentText" placeholder="여기에 분석할 문장 또는 댓글을 입력하세요...&#10;(예: 진짜 바보 멍청이 아니야? 행동이 최악이네 꺼져라)"></textarea>
      <button class="btn-analyze" id="btnAnalyze">분석 시작</button>
    </div>

    <!-- 게이지 바 및 상세 결과 표시 영역 -->
    <div class="result-section">
      <div class="result-header">
        <span class="result-title">위험 지수</span>
        <!-- 위험도 퍼센트 숫자 -->
        <span class="percent-counter" id="lblPercent">0%</span>
      </div>

      <!-- 가로 게이지 바 컴포넌트 -->
      <div class="gauge-track">
        <div class="gauge-fill" id="gaugeFill"></div>
      </div>

      <!-- 결과 상태 요약 메시지 -->
      <div class="result-message" id="lblMessage">분석을 대기 중입니다.</div>

      <!-- 감지된 악플 단어 목록 영역 -->
      <div class="word-list-card">
        <div class="word-list-title">탐지 단어 목록</div>
        <ul class="word-ul" id="detectedList">
          <li class="empty-state" id="lblEmpty">감지된 유해 단어가 없습니다.</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- -------------------------------------------------------------
       4. JAVASCRIPT LOGIC
       ------------------------------------------------------------- -->
  <script>
    // [요구사항 1] 악플 단어 사전 정의
    const BANNED_KEYWORDS = [
      "멍청이",
      "바보",
      "쓰레기",
      "한심한",
      "꺼져",
      "재수없어",
      "최악",
      "죽어",
      "미친놈",
      "병신"
    ];

    // DOM 요소 캐시
    const commentText = document.getElementById('commentText');
    const btnAnalyze = document.getElementById('btnAnalyze');
    const gaugeFill = document.getElementById('gaugeFill');
    const lblPercent = document.getElementById('lblPercent');
    const lblMessage = document.getElementById('lblMessage');
    const detectedList = document.getElementById('detectedList');
    const lblEmpty = document.getElementById('lblEmpty');
    const rootStyle = document.documentElement;

    // 현재의 수치를 기억하기 위한 전역 변수
    let currentScore = 0;

    // 1. 단어 검출 및 위험도 연산 기능
    function runDetection() {
      const text = commentText.value.trim();
      
      // 감지된 고유 단어들을 중복 제거하여 담을 집합(Set) 생성
      const uniqueFoundWords = new Set();
      let detectedCount = 0;

      if (text.length > 0) {
        BANNED_KEYWORDS.forEach(word => {
          // 대소문자 구분 없이 매칭 여부 판독
          const lowerText = text.toLowerCase();
          const lowerWord = word.toLowerCase();
          
          if (lowerText.includes(lowerWord)) {
            // 중복 없이 탐지된 고유 단어 목록에 삽입
            uniqueFoundWords.add(word);
            
            // 본문 내에 해당 단어가 몇 번 쓰였는지 발생 빈도 계산
            let idx = lowerText.indexOf(lowerWord);
            while (idx !== -1) {
              detectedCount++;
              idx = lowerText.indexOf(lowerWord, idx + 1);
            }
          }
        });
      }

      // [요구사항 2] 위험도 계산 매핑 로직
      let targetPercent = 0;
      let statusText = '';
      let messageText = '';
      let colorVariable = '';
      let glowVariable = '';

      if (detectedCount === 0) {
        // 0개: 위험도 0%, 상태: 안전
        targetPercent = 0;
        statusText = '안전 (Safe)';
        messageText = '안전한 댓글입니다.';
        colorVariable = 'var(--color-safe)';
        glowVariable = 'var(--glow-safe)';
      } else if (detectedCount >= 1 && detectedCount <= 2) {
        // 1~2개: 위험도 50%, 상태: 주의
        targetPercent = 50;
        statusText = '주의 (Caution)';
        messageText = '주의가 필요한 표현이 포함되어 있습니다.';
        colorVariable = 'var(--color-caution)';
        glowVariable = 'var(--glow-caution)';
      } else {
        // 3개 이상: 위험도 100%, 상태: 위험
        targetPercent = 100;
        statusText = '위험 (Danger)';
        messageText = '악성 표현이 다수 포함되어 있습니다.';
        colorVariable = 'var(--color-danger)';
        glowVariable = 'var(--glow-danger)';
      }

      // 2. 동적 게이지 업데이트 애니메이션 발동
      rootStyle.style.setProperty('--gauge-color', colorVariable);
      rootStyle.style.setProperty('--gauge-glow', glowVariable);
      gaugeFill.style.width = `${targetPercent}%`; // CSS transition에 의해 1초 동안 width 변경 작동

      // 3. 퍼센트 숫자 실시간 카운터 애니메이션 실행
      animatePercentage(targetPercent);

      // 4. 요약 결과 및 결과 텍스트 바인딩
      lblMessage.textContent = messageText;

      // 5. 탐지된 중복 제거 단어 렌더링
      renderWordsList(Array.from(uniqueFoundWords));
    }

    // [요구사항 3] 퍼센트 숫자 카운터 애니메이션 구현 (requestAnimationFrame 활용)
    function animatePercentage(target) {
      const start = currentScore;
      const end = target;
      
      if (start === end) {
        lblPercent.textContent = `${end}%`;
        return;
      }
      
      const duration = 1000; // 1000ms (1초) 설정
      let startTime = null;
      
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        
        // 부드럽게 증가하는 숫자 계산
        const val = Math.floor(progress * (end - start) + start);
        lblPercent.textContent = `${val}%`;
        
        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          currentScore = end; // 종료 시 최신 수치 동기화
          lblPercent.textContent = `${end}%`;
        }
      }
      
      window.requestAnimationFrame(step);
    }

    // [요구사항 4] 중복이 제거된 탐지 단어 리스트 렌더링
    function renderWordsList(wordsArray) {
      // 기존 목록 비우기
      detectedList.innerHTML = '';
      
      if (wordsArray.length === 0) {
        detectedList.appendChild(lblEmpty);
        return;
      }

      // 단어마다 별도의 <li> 태그 생성하여 표시
      wordsArray.forEach(word => {
        const li = document.createElement('li');
        li.className = 'word-li';
        li.textContent = word;
        detectedList.appendChild(li);
      });
    }

    // 버튼 클릭 이벤트에 바인딩
    btnAnalyze.addEventListener('click', runDetection);

    // textarea 내 키보드 입력 편의 기능 (Ctrl + Enter로 바로 검사 가능)
    commentText.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        runDetection();
      }
    });

    // 기본 로드 시 연산 수행 초기화
    runDetection();
  </script>
</body>
</html>
